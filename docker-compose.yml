services:
  taskflow-postgres:
    image: postgres:15
    container_name: taskflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  taskflow-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - taskflow-postgres
    ports:
      - "4001:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@taskflow-postgres:5432/taskflow

  taskflow-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - taskflow-backend

volumes:
  pgdata:
